# Mirrors quad_description ros_control so champ_gazebo can also resolve it
# if a launch file points at the config package path.
controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 250  # Hz

    joint_states_controller:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_group_effort_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_group_effort_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - lf_hip_joint
      - lf_upper_leg_joint
      - lf_lower_leg_joint
      - rf_hip_joint
      - rf_upper_leg_joint
      - rf_lower_leg_joint
      - lh_hip_joint
      - lh_upper_leg_joint
      - lh_lower_leg_joint
      - rh_hip_joint
      - rh_upper_leg_joint
      - rh_lower_leg_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    gains:
      lf_hip_joint:       {p: 50.0, i: 0.0, d: 3.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      lf_upper_leg_joint: {p: 80.0, i: 0.0, d: 4.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      lf_lower_leg_joint: {p: 80.0, i: 0.0, d: 4.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      rf_hip_joint:       {p: 50.0, i: 0.0, d: 3.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      rf_upper_leg_joint: {p: 80.0, i: 0.0, d: 4.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      rf_lower_leg_joint: {p: 80.0, i: 0.0, d: 4.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      lh_hip_joint:       {p: 50.0, i: 0.0, d: 3.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      lh_upper_leg_joint: {p: 80.0, i: 0.0, d: 4.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      lh_lower_leg_joint: {p: 80.0, i: 0.0, d: 4.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      rh_hip_joint:       {p: 50.0, i: 0.0, d: 3.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      rh_upper_leg_joint: {p: 80.0, i: 0.0, d: 4.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      rh_lower_leg_joint: {p: 80.0, i: 0.0, d: 4.0, i_clamp: 0.0, ff_velocity_scale: 0.0}

    allow_partial_joints_goal: true
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.5
      goal_time: 0.0
