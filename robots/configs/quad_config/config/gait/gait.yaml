/**:
  ros__parameters:
    gait:
      # Knee bend direction: ">>" both knees back (dog-like).
      # Try "<<" or "><" if legs fold the wrong way in sim.
      knee_orientation: ">>"
      pantograph_leg: false
      odom_scaler: 1.0
      max_linear_velocity_x: 0.25
      max_linear_velocity_y: 0.15
      max_angular_velocity_z: 0.5
      com_x_translation: 0.0
      swing_height: 0.03
      stance_depth: 0.005
      stance_duration: 0.25
      # Standing height from SolidWorks export (q=0). Front feet ~0.226 m below
      # base, rear ~0.220 m. Use 0.220 so CHAMP stand IK holds joints near zero.
      nominal_height: 0.220
