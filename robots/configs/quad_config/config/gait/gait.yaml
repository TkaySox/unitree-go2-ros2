/**:
  ros__parameters:
    gait:
      # Knee bend direction: ">>" both knees back (dog-like).
      # Try "<<" or "><" if legs fold the wrong way in sim.
      knee_orientation: ">>"
      pantograph_leg: false
      odom_scaler: 1.0

      # --- step size / "legs move too much" ---
      # Step length ≈ velocity × stance_duration. Lower max_linear_velocity_x
      # first if strides are huge in forward/back teleop.
      max_linear_velocity_x: 0.12   # was 0.25 — smaller max stride
      max_linear_velocity_y: 0.08
      max_angular_velocity_z: 0.35
      # Shorter stance → smaller steps at the same speed (slightly faster cadence).
      stance_duration: 0.20         # was 0.25

      # How high feet lift in swing (metres). Lower if legs flail upward.
      swing_height: 0.015           # was 0.03
      stance_depth: 0.0

      com_x_translation: 0.0
      # Default stand height (metres). Runtime /body_pose.position.z is an offset
      # on top of this value.
      nominal_height: 0.13
