# Core ros_gz_bridge topics needed for every CHAMP robot in Gazebo Harmonic:
# sim clock, IMU, and ground-truth odometry. Sensor-specific bridges
# (2D laser, Velodyne) live in laser_bridge.yaml / velodyne_bridge.yaml and
# are only included when that sensor is present on the robot.
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "imu/data"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "odom/ground_truth"
  gz_topic_name: "odom/ground_truth"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
